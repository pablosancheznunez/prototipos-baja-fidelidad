  output-dir: _book
  resources:
  - laboratorio.js
  - fuentes
  - datos
  - webr
  - webr-repo
  - plantillas
  - pdf
  - moodle
  - sw.js
book:
  title: Esquemas de página y prototipos de baja fidelidad
  subtitle: Guía interactiva para el Máster Universitario en Experiencia de Usuario y Análisis de Información Digital
  author:
  - name: Pablo Sánchez-Núñez
    orcid: 0000-0001-7845-9506
    url: https://pablosancheznunez.com
    affiliation: Universidad Carlos III de Madrid
  date: last-modified
  date-format: D [de] MMMM [de] YYYY
  language: es
  site-url: https://pablosancheznunez.com/prototipos-baja-fidelidad/
  doi: 10.5281/zenodo.24515131
  search: true
  page-navigation: true
  sidebar:
    tools:
    - icon: download
      menu:
      - text: Libro en PDF
        href: pdf/prototipos-baja-fidelidad.pdf
      - text: Libro en EPUB (lectores de libros electrónicos)
        href: pdf/prototipos-baja-fidelidad.epub
  page-footer:
    left: © 2026 [Pablo Sánchez-Núñez](https://pablosancheznunez.com) · [ORCID 0000-0001-7845-9506](https://orcid.org/0000-0001-7845-9506) · Texto bajo licencia [CC BY 4.0](https://creativecommons.org/licenses/by/4.0/deed.es)
    right: Universidad Carlos III de Madrid · Hecho con [Quarto](https://quarto.org) y [webR](https://docs.r-wasm.org/webr/latest/)
  chapters:
  - index.qmd
  - 00-r-en-el-libro.qmd
  - part: Temas
    chapters:
    - 01-fundamentos.qmd
    - 02-investigacion.qmd
    - 03-problema.qmd
    - 04-metricas.qmd
    - 05-flujos.qmd
    - 06-storyboards.qmd
    - 07-wireframes.qmd
    - 08-estados.qmd
    - 09-prototipos-papel.qmd
    - 10-sesgos.qmd
    - 11-atencion.qmd
    - 12-inclusivo.qmd
  appendices:
  - 93-galeria.qmd
  - 94-patrones.qmd
  - 95-casos.qmd
  - 90-uxlearn.qmd
  - 91-guia-docente.qmd
  - 92-glosario.qmd
lang: es
crossref:
  chapters: false
filters:
- webex
- interactivos
- glosario.lua
format:
  live-html:
    theme:
      light:
      - cosmo
      - estilos.scss
      dark:
      - darkly
      - estilos-oscuro.scss
    respect-user-color-scheme: true
    toc: true
    toc-depth: 3
    number-sections: false
    code-copy: true
    lightbox: auto
    footnotes-hover: true
    reference-location: margin
    css: fuentes/fuentes.css
    link-external-newwindow: true
    callout-appearance: simple
    include-in-header:
    - laboratorio.html
    include-after-body:
    - accesibilidad.html
    - progreso.html
webr:
  engine-url: webr/
  repos:
  - webr-repo
  resources:
  - datos
